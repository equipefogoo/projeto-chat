<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat — teste preenchido</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--panel2:#1b2940;--line:#26364d;--text:#f3f6fb;--muted:#a8b5c8;--green:#0c9b70;--green2:#087653}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:290px;max-width:38%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:18px;border-bottom:1px solid var(--line)}.brand h1{font-size:20px;margin:0}.brand small{color:#6ee7b7}.search{padding:12px;display:flex;gap:7px}.search input,.composer input,.login input{min-width:0;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px;outline:none}.search button,.send,.primary{background:var(--green);border-radius:11px;padding:10px 13px;font-weight:650}.people-title{padding:8px 15px;color:var(--muted);font-size:11px;letter-spacing:.1em}.people{overflow:auto;flex:1}.person{width:100%;padding:13px 16px;background:transparent;text-align:left;border-top:1px solid var(--line)}.person.active,.person:hover{background:var(--panel2)}.person strong{display:block}.person small{color:#6ee7b7}.sidefoot{padding:13px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{min-height:68px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);background:var(--panel)}.top strong{display:block}.top small{color:#6ee7b7}.tools{display:flex;gap:7px;flex-wrap:wrap}.tool,.mic,.secondary{background:var(--panel2);border:1px solid var(--line);padding:9px 11px;border-radius:10px;font-size:12px}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background-position:center;background-size:cover}.empty{margin:auto;text-align:center;color:var(--muted)}.bubble-row{display:flex}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:min(78%,480px);padding:10px 13px;border-radius:16px;background:#26364d;overflow-wrap:anywhere;box-shadow:0 2px 8px #0002}.mine .bubble{background:#087653}.bubble p{margin:0;white-space:pre-wrap}.time{font-size:10px;opacity:.7;text-align:right;margin-top:5px}.bubble audio{max-width:100%;width:250px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel)}.mic{font-size:18px;min-width:45px}.mic.recording{background:#a12842}.send{min-width:78px}.notice{padding:8px 14px;color:#fde68a;background:#352d19;font-size:12px}.login-wrap{height:100%;display:grid;place-items:center;padding:18px}.login{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:25px;display:grid;gap:13px;box-shadow:0 20px 60px #0005}.login h1{margin:0;text-align:center}.login p{margin:0;text-align:center;color:var(--muted);font-size:13px}.login label{font-size:12px;color:var(--muted)}.login .primary{padding:13px}.switch{background:none;color:#6ee7b7;padding:8px}.hint{font-size:11px!important;line-height:1.5}.hidden{display:none!important}.grayscale{filter:grayscale(1)}
@media(max-width:650px){.sidebar{width:115px;max-width:34%}.brand{padding:12px 8px}.brand h1{font-size:15px}.brand .tagline{display:none}.search{padding:7px;display:grid}.search input{font-size:11px;padding:8px}.search button{font-size:11px;padding:8px}.person{padding:11px 8px}.person strong{font-size:12px}.person small{font-size:10px;overflow-wrap:anywhere}.people-title{font-size:9px;padding:8px}.sidefoot{font-size:9px;padding:8px}.top{padding:10px}.tools{gap:4px}.tool{padding:7px;font-size:10px}.composer{padding:8px;gap:5px}.composer input{padding:10px}.send{min-width:58px;padding:9px}.messages{padding:12px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(()=>{
const root=document.getElementById('root');
let currentUser='Visitante',active='Lívia',recording=false,recorder=null,parts=[],background='';
const demoPeople=['Lívia','Rafael','Marina','João'];
const chats={};
const key=n=>n;
demoPeople.forEach(n=>chats[key(n)]=[]);
// Conversas de exemplo já preenchidas para abrir direto no chat.
chats['Lívia']=[
  {mine:false,text:'Oi! Esta é uma conversa de demonstração. 😊',time:'09:15'},
  {mine:true,text:'Olá! Estou testando o chat.',time:'09:16'},
  {mine:false,text:'Tudo certo! Você já pode testar o envio de mensagens.',time:'09:17'}
];
chats['Rafael']=[
  {mine:false,text:'Bem-vindo ao chat de teste!',time:'09:20'},
  {mine:true,text:'Obrigado! Vou testar os recursos.',time:'09:21'}
];
chats['Marina']=[
  {mine:false,text:'Aqui você pode experimentar as mensagens e o visual.',time:'09:25'}
];
chats['João']=[
  {mine:false,text:'Conversa de exemplo pronta para usar.',time:'09:30'}
];
const time=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loginScreen(){
root.innerHTML=`<div class="login-wrap"><form class="login" id="login" novalidate><div style="text-align:center;font-size:42px">💬</div><h1>Chat de Teste</h1><p>Acesso de demonstração já preenchido.</p><label for="nickname">Seu nome ou @usuário</label><input id="nickname" type="text" maxlength="24" autocomplete="nickname" placeholder="Ex.: Ana ou @ana" aria-describedby="loginError"><div id="loginError" role="alert" style="display:none;color:#fca5a5;font-size:12px"></div><button class="primary" id="enterChat" type="submit">Entrar no chat</button><p class="hint">Este é apenas um teste neste navegador. Para conversar online com outras pessoas, será preciso configurar e publicar a versão com Firebase.</p></form></div>`;
const field=document.getElementById('nickname');
const error=document.getElementById('loginError');
function enter(){
  const raw=String(field.value || '').trim();
  // Aceita @nome ou nome; o @ é apenas um identificador visual.
  const clean=raw.replace(/^@+/, '').trim();
  if(!clean){
    error.textContent='Digite seu nome ou usuário. Exemplo: @ana';
    error.style.display='block';
    field.focus();
    return;
  }
  if(clean.length > 24){
    error.textContent='Use no máximo 24 caracteres.';
    error.style.display='block';
    field.focus();
    return;
  }
  // Permite letras, acentos, números, espaços e caracteres comuns de usuário.
  if(!/^[\p{L}\p{N} ._@-]+$/u.test(clean)){
    error.textContent='Remova símbolos especiais e tente novamente.';
    error.style.display='block';
    field.focus();
    return;
  }
  currentUser=clean;
  try { localStorage.setItem('chat_demo_user', currentUser); } catch(e) {}
  render();
}
document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();enter();});
field.addEventListener('input',()=>{error.style.display='none';});
}
function render(){
root.innerHTML=`<div class="app" id="app"><aside class="sidebar"><div class="brand"><h1>💬 Chat</h1><small>@${escapeHTML(currentUser)}</small><div class="tagline" style="font-size:11px;color:var(--muted);margin-top:5px">Teste preenchido • usuário: Visitante</div></div><div class="search"><input id="search" placeholder="Buscar pessoa"><button id="find">Buscar</button></div><div class="people-title">CONTATOS DE TESTE</div><div class="people" id="people">${demoPeople.map(n=>`<button class="person ${n===active?'active':''}" data-name="${escapeHTML(n)}"><strong>${escapeHTML(n)}</strong><small>Disponível para teste</small></button>`).join('')}</div><div class="sidefoot">Demonstração local • não é chat público</div></aside><main class="main"><header class="top"><div><strong id="activeName">${escapeHTML(active)}</strong><small>Conversa de demonstração</small></div><div class="tools"><button class="tool" id="bw">◐ Preto e branco</button><button class="tool" id="bg">🖼️ Foto de fundo</button><button class="tool" id="clearBg">Limpar fundo</button><input id="bgFile" type="file" accept="image/*" class="hidden"></div></header><section class="messages" id="messages"></section><form class="composer" id="composer"><button class="mic" type="button" id="mic" title="Gravar áudio">🎙️</button><input id="message" autocomplete="off" placeholder="Digite uma mensagem..."><button class="send">Enviar</button></form><div id="notice" class="notice hidden"></div></main></div>`;
root.querySelectorAll('.person').forEach(b=>b.onclick=()=>{active=b.dataset.name;render();});
document.getElementById('find').onclick=()=>{let q=document.getElementById('search').value.trim().toLowerCase();let p=demoPeople.find(n=>n.toLowerCase()===q);if(p){active=p;render();}else showNotice('No teste, escolha um dos contatos exibidos na lista.');};
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('find').click();}});
document.getElementById('composer').onsubmit=e=>{e.preventDefault();const input=document.getElementById('message');const val=input.value.trim();if(!val)return;chats[active].push({mine:true,text:val,time:time()});input.value='';drawMessages();setTimeout(()=>{chats[active].push({mine:false,text:'Mensagem recebida no modo de teste! Na versão online, outra pessoa poderá responder de verdade.',time:time()});if(active===document.getElementById('activeName').textContent)drawMessages();},900);};
document.getElementById('bw').onclick=()=>document.getElementById('app').classList.toggle('grayscale');
document.getElementById('bg').onclick=()=>document.getElementById('bgFile').click();
document.getElementById('bgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024){showNotice('Escolha uma imagem de até 4 MB.');return;}const r=new FileReader();r.onload=()=>{background=r.result;document.getElementById('messages').style.backgroundImage=`linear-gradient(#07101acc,#07101acc),url("${background}")`;};r.readAsDataURL(f);};
document.getElementById('clearBg').onclick=()=>{background='';document.getElementById('messages').style.backgroundImage='';};
document.getElementById('mic').onclick=toggleRecording;
drawMessages();
}
function drawMessages(){const box=document.getElementById('messages');if(!box)return;const arr=chats[active]||[];box.innerHTML=arr.length?arr.map(m=>`<div class="bubble-row ${m.mine?'mine':''}"><div class="bubble">${m.audio?`<audio controls src="${m.audio}"></audio>`:`<p>${escapeHTML(m.text)}</p>`}<div class="time">${m.time}</div></div></div>`).join(''):`<div class="empty"><div style="font-size:42px">💬</div><b>Conversa com ${escapeHTML(active)}</b><p>Envie uma mensagem para testar.</p></div>`;box.scrollTop=box.scrollHeight;}
function showNotice(msg){const n=document.getElementById('notice');n.textContent=msg;n.classList.remove('hidden');}
async function toggleRecording(){const btn=document.getElementById('mic');if(recording){recorder.stop();recording=false;btn.classList.remove('recording');btn.textContent='🎙️';return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){showNotice('Seu navegador não permite gravação de áudio neste modo. Teste em HTTPS ou localhost.');return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);parts=[];recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data);};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(!parts.length)return;const blob=new Blob(parts,{type:recorder.mimeType||'audio/webm'});const url=URL.createObjectURL(blob);chats[active].push({mine:true,audio:url,time:time()});drawMessages();};recorder.start();recording=true;btn.classList.add('recording');btn.textContent='⏹';}catch(e){showNotice('Não foi possível acessar o microfone. Verifique a permissão do navegador.');}}
try { render(); }
catch(err) {
  root.innerHTML='<div style="padding:24px;color:white;font-family:Arial"><h2>Não foi possível abrir o chat</h2><p>Feche este arquivo e abra novamente no Chrome.</p><pre style="white-space:pre-wrap;color:#fca5a5"></pre></div>';
  const pre=root.querySelector('pre'); if(pre) pre.textContent=String(err);
}
})();
</script>
</body></html>
